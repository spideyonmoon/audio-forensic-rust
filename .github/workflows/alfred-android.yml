name: Alfred Android compatibility
on:
  workflow_dispatch:
  push:
    paths: ['apps/alfred/**', '!apps/alfred/**/*.md', '!apps/alfred/scripts/emulator-smoke.py', '!apps/alfred/scripts/saf-ui-smoke.py', '!apps/alfred/scripts/saf-finger-tap/**', '!apps/alfred/scripts/verify_reused_build.py', '.github/workflows/alfred-android.yml', 'src/**', 'Cargo.toml', 'Cargo.lock']
  pull_request:
    paths: ['apps/alfred/**', '!apps/alfred/**/*.md', '.github/workflows/alfred-android.yml', 'src/**', 'Cargo.toml', 'Cargo.lock']
permissions:
  contents: read
concurrency:
  group: alfred-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.16+8'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/alfred/native/target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: alfred-api30-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/alfred/native/Cargo.lock', 'apps/alfred/**/gradle.lockfile', 'apps/alfred/gradle/verification-metadata.xml') }}
          # Reuse compiled dependencies after a configuration-lock-only change;
          # Cargo locks and strict Gradle checksums still validate every build.
          restore-keys: alfred-api30-${{ runner.os }}-
      - name: Native adapter host acceptance
        run: cargo test --release --locked --manifest-path apps/alfred/native/Cargo.toml
      - run: bash apps/alfred/scripts/build-linux.sh arm64-v8a
      - run: bash apps/alfred/scripts/build-linux.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: alfred-scaffold-api30
          path: apps/alfred/build/ci/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alfred-lint
          path: apps/alfred/app/build/reports/lint-results-debug.*
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: alfred-dependency-verification
          path: apps/alfred/build/reports/dependency-verification/
          retention-days: 7
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        api: [30, 31, 32, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: alfred-scaffold-api30
          path: apps/alfred/build/ci
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ALFRED_API30_PICKER_MANUAL: 'Infinix Hot 11S Android 11; owner-confirmed single/multiple/folder-subset UI on APK a1b3c42, 2026-10-08; task-results/A04.md. Replacement ALAC APK still needs owner retest.'
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 apps/alfred/scripts/emulator-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alfred-emulator-api${{ matrix.api }}
          path: emulator-evidence/
          retention-days: 7
