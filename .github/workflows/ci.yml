name: Rust core
on:
  push:
    paths-ignore: ['apps/alfred/**', '**/*.md', '.github/workflows/alfred-*.yml']
  pull_request:
    paths-ignore: ['apps/alfred/**', '**/*.md', '.github/workflows/alfred-*.yml']
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      # Public history excludes the local tests and generated numerical fixtures.
      - run: cargo clippy --locked --lib --bins -- -D warnings
      - run: cargo build --locked
      - name: Generated ALAC container compatibility regression
        run: cargo test --locked --test alac container_compatibility
  android-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo check --locked --lib --no-default-features --target aarch64-linux-android
