name: Alfred runtime acceptance (reuse verified APK)
on:
  push:
    paths: ['apps/alfred/scripts/emulator-smoke.py', 'apps/alfred/scripts/jobs-smoke.py', 'apps/alfred/scripts/features-ui-smoke.py', 'apps/alfred/scripts/saf-ui-smoke.py', 'apps/alfred/scripts/saf-finger-tap/**', 'apps/alfred/scripts/verify_reused_build.py', '.github/workflows/alfred-runtime.yml']
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Alfred build job run ID containing verified APKs
        required: false
        type: string
      apis:
        description: JSON array of affected API levels; default checks Android 11–16
        required: false
        default: '[30,31,32,33,34,35,36]'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: alfred-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-source:
    runs-on: ubuntu-24.04
    outputs:
      build_run: ${{ steps.build.outputs.run }}
      reusable: ${{ steps.source.outputs.reusable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find the branch's latest verified APK artifacts
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.build_run }}
        run: |
          run="$REQUESTED_RUN"
          if [[ -z "$run" ]]; then
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "alfred-scaffold-api30" and .expired == false and .workflow_run.head_branch == env.GITHUB_REF_NAME)] | .[0].workflow_run.id')
          fi
          [[ "$run" =~ ^[0-9]+$ ]] || { echo 'No APK artifacts; run the full build first.'; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: alfred-scaffold-api30
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}
          path: verified-build
      - name: Require identical compiled source and packaging inputs
        id: source
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if python3 apps/alfred/scripts/verify_reused_build.py verified-build --if-unchanged; then
            echo 'reusable=true' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" == 2 && "$EVENT" == push ]]; then
              echo 'reusable=false' >> "$GITHUB_OUTPUT"
            else
              exit "$status"
            fi
          fi
  emulator:
    needs: verify-source
    if: needs.verify-source.outputs.reusable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        api: ${{ fromJSON(inputs.apis || '[30,31,32,33,34,35,36]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: alfred-scaffold-api30
          run-id: ${{ needs.verify-source.outputs.build_run }}
          github-token: ${{ github.token }}
          path: apps/alfred/build/ci
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ALFRED_INPUT_ONLY: '1'
          ALFRED_API30_PICKER_MANUAL: 'Infinix Hot 11S Android 11; owner-confirmed single/multiple/folder-subset UI on APK a1b3c42, 2026-10-08; task-results/A04.md. Replacement ALAC retest deferred by owner; no new physical acceptance claimed.'
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 4096M
          script: python3 apps/alfred/scripts/emulator-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alfred-emulator-api${{ matrix.api }}
          path: emulator-evidence/
          retention-days: 7
