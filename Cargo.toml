[package]
name = "audio-forensic"
version = "0.26.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Offline audio forensic measurements with explicit coverage and uncertainty"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:ctrlc"]

[[bin]]
name = "audio-forensic"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
ctrlc = { version = "3.4", optional = true }
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
symphonia = { version = "0.5.5", default-features = false, features = ["flac", "wav", "pcm"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
