[package]
name = "alfred-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
name = "alfred_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
audio-forensic = { path = "../../../..", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
jni = "=0.21.1"
